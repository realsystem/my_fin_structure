[project]
name = "bank-statement-parser"
version = "0.1.0"
description = "Parse bank statements from PDFs and export to Google Sheets"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.10",
    "gspread>=6.0",
    "google-auth>=2.0",
    "click>=8.0",
]

[project.scripts]
bsp = "src.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
